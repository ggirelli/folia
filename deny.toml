# cargo-deny configuration (`just deny`): advisories, licences, duplicate crates and sources.
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # RUSTSEC-2025-0141 is informational ("unmaintained"): bincode's authors stopped work and
    # consider 1.3.3 complete; no vulnerability, no patched version. syntect 5.3.0 (the latest)
    # requires bincode 1 for any parsing (its `parsing` feature enables `dump-create`), and uses
    # it only to decode the syntax set compiled into the binary (two-face's `include_bytes!`),
    # never outside input. `[bans]` below keeps bincode to syntect. Approved with the highlighter
    # (Q12, plan v5, §10 spike 1); revisit when syntect drops bincode 1.
    { id = "RUSTSEC-2025-0141", reason = "bincode 1 decodes only the syntaxes compiled into syntect's dump; approved with Q12 (plan v5, spike 1)" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "Apache-2.0",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
deny = [
    # Only syntect may depend on bincode, the crate RUSTSEC-2025-0141's exception covers.
    { crate = "bincode", wrappers = ["syntect"], reason = "unmaintained (RUSTSEC-2025-0141); allowed only for syntect's embedded syntaxes" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

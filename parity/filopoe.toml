# Folia's configuration for the reference site (filopoe), used by the parity tools and
# `just build` until the site carries its own, as _folia/folia.toml (plan v6, §14 Q5 and Q8).

time-zone = "Europe/Stockholm"

# The site's templates (Q5): in the site, in a directory Jekyll ignores.
templates-dir = "_folia/templates"

include = [".htaccess"]

# What the site's _config.yml excludes, plus Jekyll's default excludes, written as Folia's globs.
# Jekyll also matches each pattern as a plain string prefix, so "LICENSE" there excluded the
# LICENSE-*.txt files and "Gemfile" excluded Gemfile.lock; the patterns below say so explicitly.
exclude = [
  "CHANGELOG.md",
  "CHECKLIST.md",
  "Gemfile*",
  "LICENSE*",
  "README-*.md",
  "README.md",
  "gulpfile.js",
  "jekyll-text-theme.gemspec",
  "package-lock.json",
  "package.json",
  "docs",
  "node_modules",
  "screenshots",
  "test",
  "vendor",
  "Justfile",
  "assets/json/notes_graph.json",
  "gemfiles",
]

[roots]
blog = "_posts"
micro = "_micro"
garden = "_digital_garden"

# What _config.yml says the site is: `url`, and `title` (also its `name`) and `description`.
[site]
url = "https://ggirelli.info"
title = "Filopoetica"
description = "An eclectic blog."

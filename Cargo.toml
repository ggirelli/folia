# Folia's crates (plan v3, §4): a content model, one crate per mode, the site builder, and the
# dev-only parity tool. Modes depend on folia-core only, never on each other.
[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/ggirelli/folia"
publish = false

# Versions shared by several crates of the workspace.
[workspace.dependencies]
folia = { path = "crates/folia", version = "0.0.0" }
folia-blog = { path = "crates/blog", version = "0.0.0" }
folia-core = { path = "crates/core", version = "0.0.0" }
folia-garden = { path = "crates/garden", version = "0.0.0" }
folia-micro = { path = "crates/micro", version = "0.0.0" }
folia-pages = { path = "crates/pages", version = "0.0.0" }
clap = { version = "4.6", features = ["derive"] }
globset = "0.4.20"
jiff = "0.2.38"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1"
yaml-rust2 = { version = "0.13", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
